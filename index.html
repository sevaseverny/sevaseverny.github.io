      var DX = -6.504, UP = -65.063;  // положение букв в собранном квадрате
      var BR = [[560.97381, 611.96359], [511.8244, 611.96359], [511.8244, 731.97922], [986.17498, 731.97922],
                [986.17498, 611.96359], [937.02459, 611.96359], [937.02459, 682.8298], [560.97381, 682.8298]];
      var RIGHT = [3, 4, 5, 6];       // точки правой части скобки: на шаге 2 едут влево вместе со второй «А»
      var DUR = 1500;                 // всё превращение целиком, мс
      var ease = function (x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      var lerp = function (a, b, t) { return a + (b - a) * t; };
      var tr = function (e, x, y) { e.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')'); };
      var draw = function (u) {       // u: 0 = горизонтально, 1 = квадрат
        var s1 = ease(Math.min(1, u * 2)), s2 = ease(Math.max(0, u * 2 - 1));
        var up = lerp(147.535, UP, s1);                       // «Б» и «Э» поднимаются
        tr(el.b, lerp(-219.1, DX, s2), up);
        tr(el.z, DX, up);
        tr(el.a1, DX, UP);
        tr(el.a2, lerp(206.099, DX, s2), UP);
        tr(el.tag, lerp(98.9, DX, s2), UP);
        tr(el.all, 0, lerp(-106.3, 0, s1));                   // весь логотип остаётся по центру поля
        el.br.setAttribute('points', BR.map(function (p, i) {
          return (p[0] - (RIGHT.indexOf(i) >= 0 ? P * s2 : 0)).toFixed(2) + ' ' + p[1].toFixed(2);
        }).join(' '));
        var g = (s1 + s2) / 2;                                // градиент в буквах плавно едет от горизонтального положения к квадратному
        GR.forEach(function (n, i) { el.grad.setAttribute(n, lerp(GH[i], GS[i], g).toFixed(2)); });
      };
      var cur = 0, target = 0, from = 0, t0 = 0, run = false;
      var step = function (now) {
        var k = Math.min(1, (now - t0) / DUR);
        cur = from + (target - from) * k;
        draw(cur);
        if (k < 1) requestAnimationFrame(step); else run = false;
      };
      var go = function (to) {
        if (to === target) return;
        target = to; from = cur; t0 = performance.now();
        if (!run) { run = true; requestAnimationFrame(step); }
      };
      var check = function (instant) {
        var r = box.getBoundingClientRect();
        var logoBottom = r.top + r.height * 0.63;            // низ самого логотипа в белом поле (подпись включена)
        var to = (logoBottom <= window.innerHeight * 0.92) ? 1 : 0;   // лого показалось и чуть отъехало от низа экрана — запускаем
        if (instant) { target = cur = to; draw(to); } else go(to);
      };
      document.addEventListener('scroll', function () { check(false); }, { passive: true });
      window.addEventListener('resize', function () { check(false); });
      check(true);
    })();
    // Wokashi: линия рыбы рисуется одним росчерком, потом глаз, зрачок, буквы, мелкий текст, в конце зрачок пульсирует
    (function () {
      var svg = document.querySelector('svg.wok-anim');
      if (!svg || !svg.animate || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
      var q = function (id) { return svg.querySelector('#wok-' + id); };
      var fish = q('fish'), eye = q('eye'), pupil = q('pupil'), pg = q('pupilg'), t1 = q('t1'), t2 = q('t2');
      var letters = ['W', 'K', 'A', 'S', 'H', 'I'].map(q);
      [fish, eye].forEach(function (p) { p.setAttribute('pathLength', '1'); p.style.strokeDasharray = '1 1'; });
      fish.style.strokeDashoffset = '-1';   // рисуется от верхнего конца хвоста к нижнему (путь в файле идёт наоборот)
      eye.style.strokeDashoffset = '1';
      [pupil, t1, t2].concat(letters).forEach(function (e) { e.style.opacity = '0'; });
      pg.style.transformBox = 'fill-box';
      pg.style.transformOrigin = 'center';
      var smooth = 'cubic-bezier(.65, 0, .35, 1)';
      var fade = function (e, delay, dur) { e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, delay: delay, easing: 'ease-out', fill: 'forwards' }); };
      var play = function () {
        var f = fish.animate([{ strokeDashoffset: -1 }, { strokeDashoffset: 0 }], { duration: 1900, easing: smooth, fill: 'forwards' });
        f.onfinish = function () { fish.style.strokeDasharray = 'none'; };
        var e = eye.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 1000, delay: 1900, easing: smooth, fill: 'forwards' });
        e.onfinish = function () { eye.style.strokeDasharray = 'none'; };
        fade(pupil, 2900, 500);
        letters.forEach(function (l, i) { fade(l, 3400 + i * 130, 500); });
        fade(t1, 4400, 800);
        fade(t2, 4700, 800);                                  // нижняя дуга чуть позже верхней
        pg.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.16)' }, { transform: 'scale(1)' }],
                   { duration: 1000, delay: 5600, iterations: 2, easing: 'ease-in-out' });
      };
      if (!window.IntersectionObserver) { play(); return; }
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting) { io.disconnect(); play(); }
      }, { threshold: 0.6 });
      io.observe(svg.parentNode);
    })();
  </script>
